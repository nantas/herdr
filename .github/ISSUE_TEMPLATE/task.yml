name: Feature or maintenance task
description: Propose a feature or maintenance task for the nantas/herdr fork.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Track personal workflow features and maintenance here.
        See [task tracking conventions](https://github.com/nantas/herdr/blob/master/docs/agents/issue-tracker.md).
        Use the Bug report template for reproducible bugs. Omit private configuration and credentials.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should change, and why is it useful?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which workflow or component is affected? Note any explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we verify this task is complete?
    validations:
      required: true
