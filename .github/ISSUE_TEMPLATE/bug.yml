name: Bug report
description: Report a reproducible bug in herdr.
body:
  - type: markdown
    attributes:
      value: |
        Report a reproducible bug in the nantas/herdr fork or its personal workflow tools.
        For features and maintenance, use the Feature or maintenance task template.
        See [task tracking conventions](https://github.com/nantas/herdr/blob/master/docs/agents/issue-tracker.md).

        Include the shortest reproduction and omit credentials or private configuration.

  - type: checkboxes
    id: bug-confirmation
    attributes:
      label: Is this a reproducible bug?
      description: For features and maintenance, use the Feature or maintenance task template.
      options:
        - label: I confirm this is a reproducible bug, not a feature request, idea, question, contribution proposal, or direction check.
          required: true
        - label: I reproduced this bug on the version and environment reported below using the exact steps provided.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What is happening now? Describe what you observed, not a guessed cause.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What are the shortest exact steps or commands that show the problem?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect you?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Herdr version, update channel, operating system, and terminal are required. Shell and relevant config are optional.
      value: |
        - Herdr version:
        - Update channel (stable or preview):
        - Operating system:
        - Terminal:
        - Shell, if relevant:
        - Relevant config, if any:
    validations:
      required: true
